spring.application.name=garden-app-garden-engine
server.port=8083

# Mongo Configuration
spring.data.mongodb.uri=${DB_URI}

# RabbitMq
spring.rabbitmq.host=${RABBIT_DEV_HOST}
spring.rabbitmq.port=${RABBIT_DEV_PORT}
spring.rabbitmq.username=${RABBIT_DEV_USERNAME}
spring.rabbitmq.password=${RABBIT_DEV_PASSWORD}
spring.rabbitmq.virtual-host=/
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# RabbitMQ exchange/queue/routing key
rabbitmq.exchange=${RABBIT_ENGINE_EXCHANGE}
rabbitmq.queue=${RABBIT_ENGINE_QUEUE}
rabbitmq.routing-key=${RABBIT_ENGINE_ROUTING_KEY}

rabbitmq.audit.exchange=${RABBIT_DEV_EXCHANGE}
rabbitmq.audit.queue=${RABBIT_DEV_QUEUE}
rabbitmq.audit.routing-key=${RABBIT_DEV_ROUTING_KEY}